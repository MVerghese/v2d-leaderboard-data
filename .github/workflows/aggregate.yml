name: aggregate-track3-test

# On demand: pull the six Track 3 test competitions and commit
# dummy_leaderboard.json on this branch. The challenge page reads main/leaderboard.json.
#
# Needs one repository secret, KAGGLE_API_TOKEN (a static token from
# https://www.kaggle.com/settings/api). Without it each run logs a warning and commits nothing.

on:
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race on the same commit. A queued run waits rather than being cancelled,
# because the later run carries the fresher data.
concurrency:
  group: aggregate-track3-test
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Kaggle client
        run: pip install --disable-pip-version-check --quiet "kaggle==2.2.4"

      # A competition that does not exist yet, or has no submissions, is not an error: the
      # aggregator logs it, marks its metric available=false, and lists it in the track's
      # warnings. Only a failed authentication or an unparseable config fails the run.
      - name: Aggregate
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # Until the secret exists, skip with a warning instead of failing (and emailing) every
          # 15 minutes.
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "::warning::KAGGLE_API_TOKEN secret is not set; skipping aggregation"
            exit 0
          fi
          python aggregator/v2d_aggregate.py --config aggregator/tracks.test.json --out dummy_leaderboard.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- dummy_leaderboard.json; then
            echo "dummy_leaderboard.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dummy_leaderboard.json
          git commit -m "leaderboard: scores changed ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # A human may have pushed while this ran. dummy_leaderboard.json is only ever written here,
          # so rebasing over their commit cannot conflict.
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
