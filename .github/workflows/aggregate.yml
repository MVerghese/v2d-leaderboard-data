name: aggregate

# Pull standings and record changes every 15 minutes.
# Requires the KAGGLE_API_TOKEN repository secret.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race on the same commit. A queued run waits rather than being cancelled,
# because the later run carries the fresher data.
concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Kaggle client
        run: pip install --disable-pip-version-check --quiet "kaggle==2.2.4"

      # A competition that does not exist yet, or has no submissions, is not an error: the
      # aggregator logs it, marks its metric available=false, and lists it in the track's
      # warnings. Only a failed authentication or an unparseable config fails the run.
      - name: Test history persistence
        run: python -m unittest discover -s tests -p "test_aggregate_history.py"

      - name: Aggregate
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # Until the secret exists, skip with a warning instead of failing (and emailing) every
          # 15 minutes.
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "::warning::KAGGLE_API_TOKEN secret is not set; skipping aggregation"
            exit 0
          fi
          python aggregator/v2d_aggregate.py --out leaderboard.json --history submission_history.jsonl

      - name: Commit if changed
        run: |
          git add -- leaderboard.json
          if [ -f submission_history.jsonl ]; then
            git add -- submission_history.jsonl
          fi
          if git diff --cached --quiet; then
            echo "Standings and history unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "leaderboard: observations updated ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
